name: Build & Release typingforge

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.os }} - ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: forgetyping.exe
            asset_name: forgetyping-windows-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: forgetyping
            asset_name: forgetyping-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: forgetyping
            asset_name: forgetyping-macos-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: forgetyping
            asset_name: forgetyping-linux-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux audio and GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config libx11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --bin forgetyping

      # Windows: Build "Next, Next, Next" Graphical Installer & Portable Zip
      - name: Compile Windows Inno Setup Installer & Portable Zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "target/release", "target/installer", "dist"
          Copy-Item "target/${{ matrix.target }}/release/forgetyping.exe" "target/release/forgetyping.exe" -Force
          Copy-Item "target/${{ matrix.target }}/release/forgetyping.exe" "dist/forgetyping.exe" -Force

          # Compress portable zip
          Compress-Archive -Path "dist/forgetyping.exe" -DestinationPath "target/installer/forgetyping-windows-portable.zip" -Force

          # Install Inno Setup
          choco install innosetup -y --no-progress

          # Compile the installer using full ISCC path
          $innoExe = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $innoExe) {
            & $innoExe installer/inno_setup.iss
          } else {
            iscc installer/inno_setup.iss
          }

          # Verify files exist
          Get-ChildItem -Path "target/installer"

      # Unix: Package tar.gz archives
      - name: Package Unix Binaries
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/forgetyping dist/
          cd dist && tar -czvf ../${{ matrix.asset_name }}.tar.gz forgetyping

      # Upload Artifacts for release consolidation
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.asset_name }}
          path: |
            target/installer/forgetyping-windows-setup.exe
            target/installer/forgetyping-windows-portable.zip
            *.tar.gz
          if-no-files-found: ignore

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la release-assets

      - name: Create & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
