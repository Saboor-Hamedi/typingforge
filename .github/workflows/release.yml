name: Build & Release typingforge

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.os }} - ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: forgetyping.exe
            asset_name: forgetyping-windows-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: forgetyping
            asset_name: forgetyping-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: forgetyping
            asset_name: forgetyping-macos-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: forgetyping
            asset_name: forgetyping-linux-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux audio and GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config libx11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --bin forgetyping

      # Windows: Build Graphical Installer (.exe), Standalone .exe, and Portable .zip
      - name: Compile Windows Inno Setup Installer & Binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist", "target/release", "src/target/release", "target/installer", "src/target/installer"
          
          # Find compiled forgetyping.exe
          $exe = Get-ChildItem -Path . -Filter "forgetyping.exe" -Recurse | Where-Object { $_.FullName -like "*release*forgetyping.exe" } | Select-Object -First 1
          if (-not $exe) {
            throw "Could not find compiled forgetyping.exe"
          }
          Write-Host "Found binary: $($exe.FullName)"
          
          # 1. Standalone Direct Executable (.exe)
          Copy-Item $exe.FullName "dist/forgetyping-windows-x86_64.exe" -Force
          Copy-Item $exe.FullName "dist/forgetyping.exe" -Force
          Copy-Item $exe.FullName "target/release/forgetyping.exe" -Force
          Copy-Item $exe.FullName "src/target/release/forgetyping.exe" -Force
          
          # 2. Portable Zip (.zip)
          Compress-Archive -Path "dist/forgetyping.exe" -DestinationPath "dist/forgetyping-windows-portable.zip" -Force
          Remove-Item "dist/forgetyping.exe" -Force
          
          # 3. Graphical Installer (.exe) via Inno Setup
          choco install innosetup -y --no-progress
          $iss = Get-ChildItem -Path . -Filter "inno_setup.iss" -Recurse | Select-Object -First 1
          if ($iss) {
            Write-Host "Compiling Inno Setup script: $($iss.FullName)"
            $innoExe = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            if (Test-Path $innoExe) {
              & $innoExe $iss.FullName
            } else {
              iscc $iss.FullName
            }
            
            # Find and copy setup installer to dist
            $setup = Get-ChildItem -Path . -Filter "*setup.exe" -Recurse | Select-Object -First 1
            if ($setup) {
              Copy-Item $setup.FullName "dist/forgetyping-windows-setup.exe" -Force
              Write-Host "Installer created: $($setup.FullName)"
            }
          }
          
          # List all generated files for Windows
          Get-ChildItem -Path "dist"

      # Unix: Package Standalone Direct Binary & Compressed tar.gz Archive
      - name: Package Unix Binaries & Archives
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          # Find the compiled binary
          BIN_PATH=$(find . -name "forgetyping" -type f -perm -111 2>/dev/null | grep -E "release/forgetyping$" | head -n 1)
          if [ -z "$BIN_PATH" ]; then
            BIN_PATH="target/${{ matrix.target }}/release/forgetyping"
          fi
          echo "Found binary at $BIN_PATH"
          
          # 1. Standalone direct binary (no extraction needed)
          cp "$BIN_PATH" "dist/${{ matrix.asset_name }}"
          chmod +x "dist/${{ matrix.asset_name }}"
          
          # 2. Compressed tar.gz archive
          cd dist && tar -czvf "${{ matrix.asset_name }}.tar.gz" "${{ matrix.asset_name }}"
          cd ..
          
          ls -la dist/

      # Upload Artifacts for release consolidation
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.asset_name }}
          path: dist/*
          if-no-files-found: warn

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la release-assets

      - name: Create & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
